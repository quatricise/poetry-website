<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperion - Book I</title>
  <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas-bg"></canvas>
  <canvas id="canvas-bg2"></canvas>
  <canvas id="canvas-mg"></canvas>
  <canvas id="canvas-mg2"></canvas>
  <canvas id="canvas-text" class="grab"></canvas>
  <canvas id="canvas-fg"></canvas>
  <canvas id="canvas-fg2"></canvas>
  <div class="input-cont hidden" id="query-box">
    <input type="text" id="query-input">
    <div class="id-display" id="selected-object-id"></div>
    <div class="slider-cont">
      <span class="slider-label">x:</span>
      <span class="slider-label" id="real-x-value">0</span>
      <div class="slider x" id="x-value-slider"></div>
    </div>
    <div class="slider-cont">
      <span class="slider-label">y:</span>
      <span class="slider-label" id="real-y-value">0</span>
      <div class="slider y" id="y-value-slider"></div>
    </div>
    <div class="slider-cont hidden">
      <span class="slider-label">Deg:</span>
      <span class="slider-label" id="rotation-value">0</span>
      <div class="slider rot" id="rotation-value-slider"></div>
    </div>
    <div class="slider-cont hidden">
      <input type="checkbox" name="both-axis" id="both-axis-checkbox">
      <label for="both-axis-checkbox" class="slider-label">Change both axis.</label>
    </div>
    <div class="slider-cont">
      <div class="button" id="view-changes-btn">View changes</div>
      <div class="filler"></div>
      <div class="button" id="hide-object-btn">Hide</div>
      <div class="filler"></div>
      <div class="button" id="delete-object-btn">Delete</div>
    </div>
  </div>

  <div class="changelog hidden" id="changelog">
    <div class="header">
      <div class="handle" id="handle">|||</div>
      <h3 class="heading-small">Changed objects:</h3>
      <div class="filler"></div>
      <div id="save-changes-btn">Save changes</div>
    </div>
  </div>
  <div class="title-screen">
    <!-- <canvas id="canvas-title"></canvas>
    <div class="text">
      <h4>John Keats</h4>
      <h1>Hyperion</h1>
      <div class="divider"></div>
      <h2>Book I</h2>
    </div> -->
  </div>
  <div class="hint-overlay" id="hint-overlay"></div>
  <script src="//cdnjs.cloudflare.com/ajax/libs/gsap/3.8.0/gsap.min.js" integrity="sha512-eP6ippJojIKXKO8EPLtsUMS+/sAGHGo1UN/38swqZa1ypfcD4I0V/ac5G3VzaHfDaklFmQLEs51lhkkVaqg60Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="poem.js"></script>
  <script src="assets.js"></script>
  <script src="audio.js"></script>
  <script src="title_screen.js"></script>
  <script src="export_json.js"></script>
  <script src="object_data.json"></script>
  <script src="read_object_data.js"></script>
  <script src="math_stuff.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
